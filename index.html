<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Informations sur la page (invisibles à l'écran) -->
  <meta charset="UTF-8">
  <!-- Cette ligne adapte la page à la taille de l'écran du téléphone -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devine le nombre</title>

  <!-- Le style : les couleurs, les tailles, la mise en page -->
  <style>
    body {
      font-family: sans-serif;
      background: #f0f4f8;
      color: #222;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    .carte {
      max-width: 400px;
      margin: 40px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
    }
    input, button {
      font-size: 24px;
      padding: 12px;
      width: 100%;
      box-sizing: border-box;
      margin-top: 12px;
      border-radius: 10px;
    }
    input {
      border: 2px solid #ccc;
    }
    button {
      background: #2b6cb0;
      color: white;
      border: none;
    }
    #message {
      font-size: 28px;
      font-weight: bold;
      min-height: 40px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Le contenu visible de la page -->
  <div class="carte">
    <h1>Devine le nombre</h1>
    <p>J'ai choisi un nombre entre 1 et 100. À toi de le trouver !</p>

    <input id="champ" type="number" min="1" max="100" placeholder="Ton nombre">
    <button id="bouton-essayer">Essayer</button>

    <p id="message"></p>
    <p id="essais"></p>

    <button id="bouton-rejouer" hidden>Rejouer</button>
  </div>

  <!-- Le programme : ce qui se passe quand on clique -->
  <script>
    // L'ordinateur choisit un nombre au hasard entre 1 et 100
    let nombreSecret = Math.floor(Math.random() * 100) + 1;
    let nombreEssais = 0;

    // On récupère les éléments de la page dont on a besoin
    const champ = document.getElementById("champ");
    const boutonEssayer = document.getElementById("bouton-essayer");
    const boutonRejouer = document.getElementById("bouton-rejouer");
    const message = document.getElementById("message");
    const essais = document.getElementById("essais");

    // Ce qui se passe quand le joueur essaie un nombre
    function essayer() {
      const proposition = Number(champ.value);

      // On vérifie que le nombre est bien entre 1 et 100
      if (proposition < 1 || proposition > 100) {
        message.textContent = "Tape un nombre entre 1 et 100";
        return;
      }

      nombreEssais = nombreEssais + 1;
      essais.textContent = "Nombre d'essais : " + nombreEssais;

      // On compare la proposition au nombre secret
      if (proposition < nombreSecret) {
        message.textContent = "Plus grand ⬆️";
      } else if (proposition > nombreSecret) {
        message.textContent = "Plus petit ⬇️";
      } else {
        message.textContent = "Bravo ! 🎉";
        boutonEssayer.hidden = true;
        boutonRejouer.hidden = false;
      }

      // On vide le champ pour le prochain essai
      champ.value = "";
      champ.focus();
    }

    // Ce qui se passe quand on veut rejouer
    function rejouer() {
      nombreSecret = Math.floor(Math.random() * 100) + 1;
      nombreEssais = 0;
      message.textContent = "";
      essais.textContent = "";
      boutonEssayer.hidden = false;
      boutonRejouer.hidden = true;
      champ.focus();
    }

    // On relie les boutons aux actions
    boutonEssayer.addEventListener("click", essayer);
    boutonRejouer.addEventListener("click", rejouer);

    // La touche « Entrée » fonctionne aussi
    champ.addEventListener("keydown", function (evenement) {
      if (evenement.key === "Enter") {
        essayer();
      }
    });
  </script>

</body>
</html>
